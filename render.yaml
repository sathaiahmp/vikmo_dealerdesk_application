services:
  # -------------------------------------------------------------
  # 1. Django Backend API (Web Service)
  # -------------------------------------------------------------
  - type: web
    name: dealerdesk-backend
    runtime: python
    region: oregon
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn dealerdesk.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false  # Paste your Neon PostgreSQL URL in Render Dashboard
      - key: GROQ_API_KEY
        sync: false  # Paste your Groq API key in Render Dashboard
      - key: GEMINI_API_KEY
        sync: false  # Paste your Gemini API key in Render Dashboard
      - key: SUPPLIER_API_URL
        value: "http://127.0.0.1:8099"
      - key: SUPPLIER_API_KEY
        value: "dev-supplier-key"

  # -------------------------------------------------------------
  # 2. React Frontend UI (Static Site)
  # -------------------------------------------------------------
  - type: static_site
    name: dealerdesk-frontend
    region: oregon
    plan: free
    rootDir: Frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: dealerdesk-backend
          property: host
